name: EAS iOS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile to use"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - preview
          - production
      auto_submit:
        description: "Automatically submit the build"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: eas-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eas-ios-build:
    name: Build iOS with EAS
    runs-on: macos-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure Git LFS checkout
        run: git lfs checkout

      - name: Resolve Expo token
        env:
          EXPO_TOKEN_SECRET: ${{ secrets.EXPO_TOKEN }}
          EAS_TOKEN_SECRET: ${{ secrets.EAS_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN_SECRET" ]; then
            echo "EXPO_TOKEN=$EXPO_TOKEN_SECRET" >> "$GITHUB_ENV"
          elif [ -n "$EAS_TOKEN_SECRET" ]; then
            echo "EXPO_TOKEN=$EAS_TOKEN_SECRET" >> "$GITHUB_ENV"
          else
            echo "Missing EXPO_TOKEN or EAS_TOKEN secret." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Verify EAS auth
        run: eas whoami

      - name: Configure EAS project
        run: |
          if [ -z "${EAS_PROJECT_ID}" ]; then
            echo "Missing EAS_PROJECT_ID secret." >&2
            exit 1
          fi
          eas init --non-interactive --id "${EAS_PROJECT_ID}"

      - name: Build iOS app
        run: |
          EAS_ARGS=("--platform" "ios" "--profile" "${{ inputs.profile }}" "--non-interactive" "--wait")
          if [ "${{ inputs.auto_submit }}" = "true" ]; then
            EAS_ARGS+=("--auto-submit")
          fi
          eas build "${EAS_ARGS[@]}"
